<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #FAF8F5; /* Egg-white background */
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .hand-drawn-scribble {
            font-family: 'Brush Script MT', cursive; /* Generic fallback for scribbles */
            color: #745b00; /* Secondary Harvest token */
        }
    </style>

    body {
      min-height: max(884px, 100dvh);
    }

<body class="min-h-screen flex flex-col text-on-surface selection:bg-primary-container selection:text-on-primary-container">
<!-- Progress Bar (The Shell Suppression Rule applies: No TopAppBar or SideNav for linear onboarding) -->
<div class="fixed top-0 left-0 w-full h-[3px] bg-surface-container z-50">
<div class="h-full w-1/4 transition-all duration-700 ease-out" style="background-color: #5BA4CF;"></div>
</div>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-8 text-center max-w-2xl mx-auto">
<!-- Decoration / Scribble (Editorial Mindfulness) -->
<div class="mb-12 relative">
<div class="absolute -top-8 -right-16 opacity-20">
<svg fill="none" height="40" viewbox="0 0 120 40" width="120" xmlns="http://www.w3.org/2000/svg">
<path d="M5 35C20 30 50 10 115 5" stroke="#745b00" stroke-linecap="round" stroke-width="2"></path>
</svg>
</div>
<p class="text-secondary font-medium tracking-widest text-[0.65rem] uppercase mb-4">Step 01 / 04</p>
</div>
<!-- Headline (The Authority) -->
<h1 class="font-headline text-4xl md:text-5xl font-extrabold text-on-surface mb-6 tracking-tight leading-tight">
            What is your name?
        </h1>
<!-- Input Section (The "Space to Write" Input) -->
<div class="w-full max-w-md mt-8 group">
<input autofocus="" class="w-full bg-transparent border-none border-b-2 border-surface-variant focus:border-primary focus:ring-0 text-2xl md:text-3xl py-4 transition-all duration-300 placeholder:text-outline-variant font-body" placeholder="Type your name here..." type="text"/>
<!-- Hand-written Annotation (Editorial Voice) -->
<div class="flex justify-start mt-4">
<p class="text-secondary opacity-60 text-sm italic font-medium">
                    This is how we'll address you in your journal
                </p>
</div>
</div>
</main>
<!-- Footer Action -->
<footer class="p-12 flex flex-col items-center">
<!-- Primary CTA (Gradient & Depth Rule) -->
<button class="w-full max-w-sm py-5 px-10 rounded-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-bold text-lg shadow-sm hover:shadow-xl transition-all duration-300 transform active:scale-95 flex items-center justify-center gap-3">
            Continue
            <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
<!-- Navigation Suppressed logic: No bottom nav bars in linear onboarding. -->
</footer>
<!-- Subtle Texture Overlay -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] z-[60]">
<img alt="" class="w-full h-full object-cover" data-alt="a subtle, high-quality paper grain texture with fine organic fibers and soft imperfections for a tactile feel" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBj40Y9DjrQkqDtB_AOz5qaFiNne7P5KKQv2-XUpUFawGmT-xAphT_GRoCijJvneTaTh-5KYsmc9tnxiXixf9WgQcweFjVngqs99mxJjFMUnsAePUY0q4v3fgIOJLMI-yIkuqpPg5tu--HVZm7il5iGGF8P_9m7H1Gkqqa_pdYb-efdXF_pQeheCZVwdWITelkBBYcg6gjMYwrtxw5dlIy3enBu9C21p6dgyq7vwjTMmy9zmaB1lJm8XnWLZ6I9Gn_Dyv0ZL2y7_Xg"/>
