[package]
name = "elarin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "elarin_lib"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2", features = [] }
windows = { version = "0.57", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse"
] }
raw-window-handle = "0.6"     # safe HWND access

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
