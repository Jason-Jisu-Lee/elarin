<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Elarin</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f5f5f3" />
    <link rel="stylesheet" href="/floater.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">ELARIN</a>
      <nav class="page-tabs" aria-label="Section">
        <a href="/" data-route>Home</a>
        <a href="/about/" data-route>About</a>
        <a href="/login/" data-route>Log In</a>
        <a href="/contact/" data-route>Contact</a>
      </nav>
    </header>
    <div class="hairline"></div>

    <main class="site-main">
      <section class="hero">
        <h1 class="hero-title">ELARIN</h1>
        <div id="page-slot" class="hero-copy narrow">
          <!-- Non-JS default (Home) -->
          <h2>Web and Atlas connection successful</h2>
          <p>You are overwhelmed with information.</p>
          <p>Passively get non-intrusive, filtered, essential information.</p>
        </div>
      </section>
      <!-- Floater created/removed by JS per route -->
    </main>

    <!-- Page templates -->
    <template id="tpl-home">
      <div class="hero-copy narrow">
        <h2>Web and Atlas connection successful</h2>
        <p>You are overwhelmed with information.</p>
        <p>Passively get non-intrusive, filtered, essential information.</p>
      </div>
    </template>

    <template id="tpl-about">
      <div class="hero-copy narrow">
        <h2>About Placeholder</h2>
        <p>Content coming soon.</p>
      </div>
    </template>

    <template id="tpl-login">
      <div class="hero-copy narrow">
        <h2>Log In Placeholder</h2>
        <p>Authentication to be added.</p>
      </div>
    </template>

    <template id="tpl-contact">
      <div class="hero-copy narrow">
        <h2>Contact Placeholder</h2>
        <p>Contact flow to be added.</p>
      </div>
    </template>

    <script type="module" src="/app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js?v=9");
          navigator.serviceWorker
            .getRegistration()
            .then((r) => r && r.update());
        });
      }
    </script>
  </body>
</html>
