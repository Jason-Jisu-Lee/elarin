<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Elarin</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f5f5f3" />
    <link rel="stylesheet" href="/floater.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">ELARIN</a>
      <nav class="page-tabs" aria-label="Section">
        <a href="/" data-route>Home</a>
        <a href="/about/" data-route>About</a>
        <a href="/login/" data-route>Log In</a>
        <a href="/contact/" data-route>Contact</a>
        <a href="/404/" data-route>404</a>
      </nav>
    </header>
    <div class="hairline"></div>

    <main class="site-main">
      <section class="hero">
        <h1 class="hero-title">ELARIN</h1>
        <div id="page-slot" class="hero-copy narrow">
          <!-- Non-JS default (Home) -->
          <h2>Web and Atlas connection successful</h2>
          <p>You are overwhelmed with information.</p>
          <p>Passively get non-intrusive, filtered, essential information.</p>
        </div>
      </section>
    </main>

    <!-- Page templates -->
    <template id="tpl-home">
      <div class="hero-copy narrow">
        <h2>Web and Atlas connection successful</h2>
        <p>You are overwhelmed with information.</p>
        <p>Passively get non-intrusive, filtered, essential information.</p>
        <p style="margin-top: 16px">
          <button id="get-elarin" class="btn-primary btn-cta">
            Get Elarin
          </button>
        </p>
      </div>
    </template>

    <template id="tpl-about">
      <div class="hero-copy narrow">
        <h2>About Placeholder</h2>
        <p>Content coming soon.</p>
      </div>
    </template>

    <template id="tpl-login">
      <div class="hero-copy narrow">
        <div id="login-banner" class="banner" hidden></div>
        <h2>Log In</h2>
        <form id="login-form" class="auth-form">
          <label
            >Email<br />
            <input type="email" name="email" required autocomplete="email" />
          </label>
          <label
            >Password<br />
            <input
              type="password"
              name="password"
              required
              autocomplete="current-password"
            />
          </label>
          <button type="submit" class="btn-primary" style="margin-top: 12px">
            Log In
          </button>
        </form>
        <p style="margin-top: 16px">
          New here? <a href="/signup/" data-route>Create an account</a>
        </p>
      </div>
    </template>

    <template id="tpl-signup">
      <div class="hero-copy narrow">
        <div id="signup-banner" class="banner" hidden></div>
        <h2>Create your account</h2>
        <form id="signup-form" class="auth-form">
          <label
            >Email<br />
            <input type="email" name="email" required autocomplete="email" />
          </label>
          <label
            >Password<br />
            <input
              type="password"
              name="password"
              required
              autocomplete="new-password"
            />
          </label>
          <label
            >Confirm password<br />
            <input
              type="password"
              name="password2"
              required
              autocomplete="new-password"
            />
          </label>
          <button type="submit" class="btn-signup" style="margin-top: 12px">
            Sign Up
          </button>
        </form>
        <div id="signup-failsafe" class="banner" hidden>
          Server error. Please try again.
        </div>
        <p style="margin-top: 16px">
          <a href="/login/" data-route>Back to login</a>
        </p>
      </div>
    </template>

    <template id="tpl-contact">
      <div class="hero-copy narrow">
        <h2>Contact Placeholder</h2>
        <p>Contact flow to be added.</p>
      </div>
    </template>

    <template id="tpl-404">
      <div class="hero-copy narrow">
        <canvas
          id="dino-canvas"
          width="800"
          height="200"
          style="max-width: 100%; border: 1px solid #e5e7eb; border-radius: 8px"
        ></canvas>
        <p id="dino-hint">Press <strong>Space</strong> to start and jump.</p>
      </div>
    </template>

    <script type="module" src="/app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js?v=12");
          navigator.serviceWorker
            .getRegistration()
            .then((r) => r && r.update());
        });
      }
    </script>
  </body>
</html>
